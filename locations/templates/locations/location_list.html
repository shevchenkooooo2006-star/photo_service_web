{% extends "base.html" %}

{% block title %}Локации - Фотосервис{% endblock %}

{% block content %}
<h2 class="mb-3">Локации</h2>
<p>Всего локаций: <strong>{{ locations|length }}</strong></p>

<div class="row">
    {% for loc in locations %}
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ loc.name }}</h5>
                    <p class="card-text">💰 Аренда: {{ loc.rent_price }} руб./ч</p>
                </div>
            </div>
        </div>
    {% empty %}
        <div class="col-12"><p class="text-muted">Локации не найдены.</p></div>
    {% endfor %}
</div>
{% endblock %}
